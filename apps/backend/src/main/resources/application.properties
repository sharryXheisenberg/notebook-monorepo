spring.application.name=notebook-backend
spring.profiles.active=dev

spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.default-property-inclusion=non_null

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:dev-only-fallback-secret-change-me-32-bytes-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.ai.openrouter-api-key=${OPENROUTER_API_KEY:missing-key-set-OPENROUTER_API_KEY-env-var}
app.ai.openrouter-base-url=https://openrouter.ai/api/v1
app.ai.rate-limit.capacity=${AI_RATE_LIMIT_CAPACITY:5}
app.ai.rate-limit.refill-per-minute=${AI_RATE_LIMIT_REFILL:5}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
spring.config.import=optional:file:.env[.properties]

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true